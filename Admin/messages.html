<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Messages | NAFEES Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script defer src="../JS/site-config.js"></script>
  <script defer src="../JS/products.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside id="admin-sidebar" class="sidebar"></aside>
    <main class="admin-main">
      <header id="admin-top" class="admin-top" data-title="Messages" data-description="Review and manage customer contact messages."></header>
      <p id="admin-notice" class="admin-notice" hidden></p>
      <section class="admin-card">
        <div class="admin-toolbar">
          <label class="sr-only" for="admin-message-search">Search messages</label>
          <input class="admin-search" id="admin-message-search" type="search" placeholder="Search name, email, phone or message">
          <label class="sr-only" for="admin-message-status">Filter by status</label>
          <select class="admin-select" id="admin-message-status">
            <option value="">All statuses</option>
            <option>New</option>
            <option>Read</option>
            <option>Replied</option>
            <option>Archived</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Customer</th><th>Message</th><th>Received</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="admin-message-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
