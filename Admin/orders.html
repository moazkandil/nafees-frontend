<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Orders | NAFEES Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script defer src="../JS/site-config.js"></script>
  <script defer src="../JS/products.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside id="admin-sidebar" class="sidebar"></aside>
    <main class="admin-main">
      <header id="admin-top" class="admin-top" data-title="Orders" data-description="Cash on Delivery orders and purchased products."></header>
      <p id="admin-notice" class="admin-notice" hidden></p>
      <section class="admin-card">
        <div class="admin-toolbar">
          <input class="admin-search" id="admin-order-search" type="search" placeholder="Search order, customer, phone or product">
          <select class="admin-select" id="admin-order-status">
            <option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option>
          </select>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>Order</th><th>Customer</th><th>Products</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
            <tbody id="admin-order-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
