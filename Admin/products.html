<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Products | NAFEES Admin</title><link rel="stylesheet" href="admin.css"><script defer src="../JS/site-config.js"></script><script defer src="../JS/products.js"></script><script defer src="admin.js"></script></head><body><div class="admin-shell"><aside id="admin-sidebar" class="sidebar"></aside><main class="admin-main"><header id="admin-top" class="admin-top" data-title="Products" data-description="Add, edit and remove local demo catalog entries."></header><p id="admin-notice" class="admin-notice" hidden></p><div class="admin-products-layout"><section class="admin-card"><div class="admin-toolbar"><input class="admin-search" id="admin-product-search" type="search" placeholder="Search products"><button class="admin-btn" type="button" data-admin-action="new-product">+ Add product</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead><tbody id="admin-product-rows"></tbody></table></div></section><form class="admin-card admin-product-form" id="admin-product-form" novalidate><h2 data-form-title>Add product</h2><input type="hidden" name="productId"><div class="admin-form-grid"><div class="admin-field"><label for="product-name">Name</label><input id="product-name" name="name" required></div><div class="admin-field"><label for="product-name-ar">Arabic name</label><input id="product-name-ar" name="nameAr"></div><div class="admin-field"><label for="product-category">Category</label><select id="product-category" name="category"><option>Oud</option><option>Oriental</option><option>Woody</option><option>Floral</option><option>Fresh</option><option>Limited Edition</option></select></div><div class="admin-field"><label for="product-gender">For</label><select id="product-gender" name="gender"><option>Men</option><option>Women</option><option>Unisex</option></select></div><div class="admin-field"><label for="product-type">Type</label><select id="product-type" name="type"><option>Extrait de Parfum</option><option>Eau de Parfum</option><option>Eau de Toilette</option></select></div><div class="admin-field"><label for="product-size">Size</label><input id="product-size" name="size" placeholder="100 ml"></div><div class="admin-field"><label for="product-price">Price (EGP)</label><input id="product-price" name="price" type="number" min="1" required></div><div class="admin-field"><label for="product-old-price">Old price (EGP)</label><input id="product-old-price" name="oldPrice" type="number" min="0"></div><div class="admin-field"><label for="product-stock">Stock</label><input id="product-stock" name="stock" type="number" min="0" required></div><div class="admin-field"><label for="product-image">Image path or URL</label><input id="product-image" name="image" placeholder="Images/product.jpg"></div><div class="admin-field full"><label for="product-description">Description</label><textarea id="product-description" name="description"></textarea></div></div><fieldset class="admin-flags"><legend>Collection flags</legend><label><input type="checkbox" name="featured"> Featured</label><label><input type="checkbox" name="bestSeller"> Best seller</label><label><input type="checkbox" name="newArrival"> New arrival</label><label><input type="checkbox" name="onSale"> On sale</label></fieldset><button class="admin-btn" type="submit">Save product</button></form></div></main></div></body></html>
